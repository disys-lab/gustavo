# Gustavo app config for Diffusion-Gemma-BF16, an analog of the "diffusion-gemma-bf16.yaml" recipe from
# https://github.com/eugr/spark-vllm-docker/blob/main/recipes/diffusion-gemma-bf16.yaml
#
# vLLM serving DiffusionGemma-4-26B-A4B-IT in BF16 on a single node
#
# WARNING: the upstream recipe applies one or more mods (runtime source patches) that
# Gustavo has no mechanism to replicate - it can only pass a container command, not run a
# pre-step that patches files inside the container before vLLM starts. Missing mod(s):
#   - mods/diffusiongemma: patches DiffusionGemma model support directly into the installed vLLM package (registry, attention backend, reasoning/tool parsers) - without it the model architecture doesn't exist in vLLM at all and will fail to load, not just run suboptimally.
# `running: false` below on purpose - flip it once you've applied the mod(s) yourself
# (see mods/diffusiongemma in https://github.com/eugr/spark-vllm-docker) or confirmed
# they're no longer needed against a current vLLM.
#
# Before uploading:
#  1. Fetch the model weights yourself onto the target spark - Gustavo does not download them.
#     Model: google/diffusiongemma-26B-A4B-it
#     Stage them at: /home/ubuntu/cypress-ai/models/google-diffusiongemma-26b-a4b-it
#     e.g. huggingface-cli download google/diffusiongemma-26B-A4B-it --local-dir
#     /home/ubuntu/cypress-ai/models/google-diffusiongemma-26b-a4b-it
#  2. GPU access (GPU_ENABLED=true) must already be set on the target spark's worker - this is
#     per-worker, not part of this file. See docs/llm-deployments.md.
#  3. This container has no default entrypoint - the full `vllm serve ...` invocation is the
#     `command` list below, matching how https://github.com/eugr/spark-vllm-docker runs it
#     (their containers don't bake in a `vllm serve` default either).
#  4. `docker_image` below (eugr/spark-vllm:latest) is a real, public, arm64-only image built
#     for the DGX Spark's GB10 chip by the recipe repo's author - NOT vllm/vllm-openai. It's a
#     rolling tag (rebuilt nightly); pin a `nightly-YYYYMMDD` tag from
#     https://hub.docker.com/r/eugr/spark-vllm/tags if you need reproducibility.
#  5. tensor_parallel=1 in this recipe's own defaults - this assumes the target spark's worker
#     actually has that many GPUs visible to Docker. Verify against your own hardware before
#     deploying; lower it to 1 if unsure.
#  6. The upstream tool runs these containers privileged by default (for RDMA/InfiniBand and
#     direct hardware access) - privileged: true below matches that. Try privileged: false if
#     your spark doesn't need it.

docker_image: eugr/spark-vllm:latest

running: false
privileged: true
network_mode: bridge

starting_ports:
  - 8000: 8000

volumes:
  - /home/ubuntu/cypress-ai/models/google-diffusiongemma-26b-a4b-it:/model

env_vars: {}

command:
  - "vllm"
  - "serve"
  - "/model"
  - "--served-model-name"
  - "diffusion-gemma-bf16"
  - "--max-model-len"
  - "262144"
  - "--gpu-memory-utilization"
  - "0.8"
  - "--port"
  - "8000"
  - "--host"
  - "0.0.0.0"
  - "--trust-remote-code"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "gemma4"
  - "--load-format"
  - "fastsafetensors"
  - "--attention-backend"
  - "TRITON_ATTN"
  - "--max-num-seqs"
  - "10"
  - "--enable-prefix-caching"
  - "--diffusion-config"
  - "{\"canvas_length\":256}"
  - "--override-generation-config"
  - "{\"max_new_tokens\": null}"
  - "--reasoning-parser"
  - "gemma4"
  - "--default-chat-template-kwargs"
  - "{\"enable_thinking\": false}"
  - "--chat-template"
  - "fixed_chat_template.jinja"
  - "--moe-backend"
  - "triton"

shm_size: "16g"
