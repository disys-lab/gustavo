# Gustavo app config for Qwen3-Coder-Next-FP8, an analog of the "qwen3-coder-next-fp8.yaml" recipe from
# https://github.com/eugr/spark-vllm-docker/blob/main/recipes/qwen3-coder-next-fp8.yaml
#
# vLLM serving Qwen3-Coder-Next-FP8
#
# Before uploading:
#  1. Fetch the model weights yourself onto the target spark - Gustavo does not download them.
#     Model: Qwen/Qwen3-Coder-Next-FP8
#     Stage them at: /home/ubuntu/cypress-ai/models/qwen-qwen3-coder-next-fp8
#     e.g. huggingface-cli download Qwen/Qwen3-Coder-Next-FP8 --local-dir
#     /home/ubuntu/cypress-ai/models/qwen-qwen3-coder-next-fp8
#  2. GPU access (GPU_ENABLED=true) must already be set on the target spark's worker - this is
#     per-worker, not part of this file. See docs/llm-deployments.md.
#  3. This container has no default entrypoint - the full `vllm serve ...` invocation is the
#     `command` list below, matching how https://github.com/eugr/spark-vllm-docker runs it
#     (their containers don't bake in a `vllm serve` default either).
#  4. `docker_image` below (eugr/spark-vllm:latest) is a real, public, arm64-only image built
#     for the DGX Spark's GB10 chip by the recipe repo's author - NOT vllm/vllm-openai. It's a
#     rolling tag (rebuilt nightly); pin a `nightly-YYYYMMDD` tag from
#     https://hub.docker.com/r/eugr/spark-vllm/tags if you need reproducibility.
#  5. tensor_parallel=2 in this recipe's own defaults - this assumes the target spark's worker
#     actually has that many GPUs visible to Docker. Verify against your own hardware before
#     deploying; lower it to 1 if unsure.
#  6. The upstream tool runs these containers privileged by default (for RDMA/InfiniBand and
#     direct hardware access) - privileged: true below matches that. Try privileged: false if
#     your spark doesn't need it.

docker_image: eugr/spark-vllm:latest

running: true
privileged: true
network_mode: bridge

starting_ports:
  - 8000: 8000

volumes:
  - /home/ubuntu/cypress-ai/models/qwen-qwen3-coder-next-fp8:/model

env_vars: {}

command:
  - "vllm"
  - "serve"
  - "/model"
  - "--served-model-name"
  - "qwen3-coder-next-fp8"
  - "--enable-auto-tool-choice"
  - "--tool-call-parser"
  - "qwen3_coder"
  - "--gpu-memory-utilization"
  - "0.8"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
  - "--kv-cache-dtype"
  - "fp8"
  - "--load-format"
  - "instanttensor"
  - "--attention-backend"
  - "flashinfer"
  - "--enable-prefix-caching"
  - "--max-model-len"
  - "131072"
  - "-tp"
  - "2"
  - "--distributed-executor-backend"
  - "ray"

shm_size: "16g"
