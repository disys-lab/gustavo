# Gustavo app config for Qwen3.8-27B-NVFP4-DFlash2, an analog of the "qwen3.8-27b-nvfp4-dflash2.yaml" recipe from
# https://github.com/eugr/spark-vllm-docker/blob/main/recipes/qwen3.8-27b-nvfp4-dflash2.yaml
#
# vLLM serving RadixArk/Qwen3.8-27B-NVFP4 with the z-lab DFlash2 draft model
#
# Before uploading:
#  1. Fetch the model weights yourself onto the target spark - Gustavo does not download them.
#     Model: RadixArk/Qwen3.8-27B-NVFP4
#     Stage them at: /home/ubuntu/cypress-ai/models/radixark-qwen3-8-27b-nvfp4
#     e.g. huggingface-cli download RadixArk/Qwen3.8-27B-NVFP4 --local-dir
#     /home/ubuntu/cypress-ai/models/radixark-qwen3-8-27b-nvfp4
#  2. GPU access (GPU_ENABLED=true) must already be set on the target spark's worker - this is
#     per-worker, not part of this file. See docs/llm-deployments.md.
#  3. This container has no default entrypoint - the full `vllm serve ...` invocation is the
#     `command` list below, matching how https://github.com/eugr/spark-vllm-docker runs it
#     (their containers don't bake in a `vllm serve` default either).
#  4. `docker_image` below (eugr/spark-vllm:latest) is a real, public, arm64-only image built
#     for the DGX Spark's GB10 chip by the recipe repo's author - NOT vllm/vllm-openai. It's a
#     rolling tag (rebuilt nightly); pin a `nightly-YYYYMMDD` tag from
#     https://hub.docker.com/r/eugr/spark-vllm/tags if you need reproducibility.
#  5. tensor_parallel=2 in this recipe's own defaults - this assumes the target spark's worker
#     actually has that many GPUs visible to Docker. Verify against your own hardware before
#     deploying; lower it to 1 if unsure.
#  6. The upstream tool runs these containers privileged by default (for RDMA/InfiniBand and
#     direct hardware access) - privileged: true below matches that. Try privileged: false if
#     your spark doesn't need it.
#  7. This recipe references a second (speculative/draft) model by HuggingFace ID directly
#     inside a flag, not redirected to a local mount like the main model:
#     z-lab/Qwen3.8-27B-DFlash2. vLLM will try to download it over the network at startup unless
#     the container has internet access (and, if the model is gated, a valid HF_TOKEN env var) -
#     it is NOT pre-staged like the main model weights.

docker_image: eugr/spark-vllm:latest

running: true
privileged: true
network_mode: bridge

starting_ports:
  - 8000: 8000

volumes:
  - /home/ubuntu/cypress-ai/models/radixark-qwen3-8-27b-nvfp4:/model

env_vars: {}

command:
  - "vllm"
  - "serve"
  - "/model"
  - "--served-model-name"
  - "qwen3-8-27b-nvfp4-dflash2"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
  - "--trust-remote-code"
  - "--kv-cache-dtype"
  - "fp8"
  - "--gpu-memory-utilization"
  - "0.7"
  - "--max-model-len"
  - "262144"
  - "--max-num-seqs"
  - "8"
  - "--max-num-batched-tokens"
  - "16384"
  - "--enable-chunked-prefill"
  - "--async-scheduling"
  - "--enable-prefix-caching"
  - "--speculative-config"
  - "{\"method\":\"dflash\",\"model\":\"z-lab/Qwen3.8-27B-DFlash2\",\"num_speculative_tokens\":8,\"draft_tensor_parallel_size\":2}"
  - "--load-format"
  - "instanttensor"
  - "--reasoning-parser"
  - "qwen3"
  - "--tool-call-parser"
  - "qwen3_xml"
  - "--enable-auto-tool-choice"
  - "--tensor-parallel-size"
  - "2"

shm_size: "16g"
