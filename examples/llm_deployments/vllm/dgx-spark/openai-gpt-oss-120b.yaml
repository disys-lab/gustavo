# Gustavo app config for OpenAI GPT-OSS 120B, an analog of the "openai-gpt-oss-120b.yaml" recipe from
# https://github.com/eugr/spark-vllm-docker/blob/main/recipes/openai-gpt-oss-120b.yaml
#
# vLLM serving openai/gpt-oss-120b with MXFP4 quantization and FlashInfer
#
# WARNING: this recipe needs a custom build (container: vllm-node-mxfp4 upstream, built via
# `build-and-copy.sh --exp-mxfp4`), not the plain vllm-node image. There is no public
# tag for this build on hub.docker.com/r/eugr/spark-vllm - only the default (non-mxfp4/
# non-b12x) build is published. You must build it yourself on a spark, push it to a registry
# Gustavo's worker can reach, and replace docker_image below with that tag.
# `running: false` below on purpose until you've done that.
#
# Before uploading:
#  1. Fetch the model weights yourself onto the target spark - Gustavo does not download them.
#     Model: openai/gpt-oss-120b
#     Stage them at: /home/ubuntu/cypress-ai/models/openai-gpt-oss-120b
#     e.g. huggingface-cli download openai/gpt-oss-120b --local-dir
#     /home/ubuntu/cypress-ai/models/openai-gpt-oss-120b
#  2. GPU access (GPU_ENABLED=true) must already be set on the target spark's worker - this is
#     per-worker, not part of this file. See docs/llm-deployments.md.
#  3. This container has no default entrypoint - the full `vllm serve ...` invocation is the
#     `command` list below, matching how https://github.com/eugr/spark-vllm-docker runs it
#     (their containers don't bake in a `vllm serve` default either).
#  4. tensor_parallel=1 in this recipe's own defaults - this assumes the target spark's worker
#     actually has that many GPUs visible to Docker. Verify against your own hardware before
#     deploying; lower it to 1 if unsure.
#  5. The upstream tool runs these containers privileged by default (for RDMA/InfiniBand and
#     direct hardware access) - privileged: true below matches that. Try privileged: false if
#     your spark doesn't need it.

docker_image: REPLACE-ME  # no public image for build target 'vllm-node-mxfp4'

running: false
privileged: true
network_mode: bridge

starting_ports:
  - 8000: 8000

volumes:
  - /home/ubuntu/cypress-ai/models/openai-gpt-oss-120b:/model

env_vars:
  VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: "1"

command:
  - "vllm"
  - "serve"
  - "/model"
  - "--served-model-name"
  - "openai-gpt-oss-120b"
  - "--tool-call-parser"
  - "openai"
  - "--reasoning-parser"
  - "openai_gptoss"
  - "--enable-auto-tool-choice"
  - "--gpu-memory-utilization"
  - "0.8"
  - "--enable-prefix-caching"
  - "--load-format"
  - "fastsafetensors"
  - "--quantization"
  - "mxfp4"
  - "--mxfp4-backend"
  - "CUTLASS"
  - "--mxfp4-layers"
  - "moe,qkv,o,lm_head"
  - "--attention-backend"
  - "FLASHINFER"
  - "--kv-cache-dtype"
  - "fp8"
  - "--max-num-batched-tokens"
  - "8192"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

shm_size: "16g"
