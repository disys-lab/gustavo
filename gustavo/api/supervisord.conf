[unix_http_server]
file=/tmp/supervisord.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

[program:gustavo-api]
; Bind to loopback only — Next.js (same host) reaches it via localhost,
; but external machines cannot bypass the Next.js auth layer.
command=/opt/venv/bin/uvicorn gustavo.api.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gustavo-ui]
command=node /app/gustavo-ui/.next/standalone/server.js
directory=/app/gustavo-ui/.next/standalone
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
