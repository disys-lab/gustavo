# Sample app config for `gustavo apps create -f sample_app_config.yaml -n my-app -d <device-group>`.
# One top-level key per app; the key is the app's name.

my-app:
    docker_image: "192.168.1.100:5001/my-app"
    env_vars:
        LOG_LEVEL: "info"
        SOME_SETTING: "some-value"
    networks:
        - "nebula"
    volumes:
      - "/tmp/:/tmp/"
      - "/var/tmp/:/var/tmp/:rw"
#    starting_ports:
#      - 8080: 80

    running: True
    rolling_restart: True
    containers_per:
        server: 1
    privileged: False
    devices: []

# Minimal example - only the required fields
my-other-app:
    docker_image: "192.168.1.100:5001/my-other-app"
    env_vars: {}
    networks:
        - "nebula"
    volumes: []
    running: True
    rolling_restart: True
    containers_per:
        server: 1
    privileged: False
    devices: []
