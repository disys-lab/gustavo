server {
    listen 5001;

    # At server level, not just the /v2/ location: client_max_body_size is
    # evaluated per-location against the incoming request's Content-Length
    # before nginx even decides whether to forward the body anywhere. The
    # internal /_registry_auth location inherited the 1MB default despite
    # proxy_pass_request_body off - that only discards the body it would
    # otherwise forward, it doesn't skip the incoming-request size check
    # that happens first. A large docker-push PATCH's auth_request
    # subrequest carries the same Content-Length as the original, so it
    # was 413ing there even though the real /v2/ location allowed it.
    client_max_body_size 0;

    # Unauthenticated: repo listing stays open, same as before.
    location /v2/_catalog {
        proxy_pass http://127.0.0.1:5051;
        # $http_host (not $host) - preserves the port the client actually
        # connected on. $host strips it, which made the registry construct
        # port-80 self-referential URLs for blob-upload redirects during
        # push (pull never hit this - no redirect chain involved).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Unauthenticated: tag listing is the other half of "browsing is free" -
    # same rationale as /v2/_catalog above. Regex (not a plain prefix) so it
    # matches namespaced repo names containing slashes (e.g. foo/bar/tags/list)
    # without also matching /v2/<name>/manifests/... or /v2/<name>/blobs/...,
    # which must stay behind auth_request below.
    location ~ ^/v2/(?<repo_name>.+)/tags/list$ {
        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Internal-only: nginx calls this for every /v2/ request below.
    # Not reachable directly from outside - "internal" enforces that.
    location = /_registry_auth {
        internal;

        proxy_pass http://127.0.0.1:3002/api/registry/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # Forwarded so a future per-repo check can see who's asking and for
        # what. Authorization is forwarded automatically (default
        # subrequest behavior) - not set explicitly, but relied on.
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location /v2/ {
        # Replaces auth_basic/auth_basic_user_file - the decision now comes
        # from Gustavo (Nebula-backed), not the static htpasswd file.
        # auth_request alone doesn't send WWW-Authenticate the way
        # auth_basic used to - without it, Docker's client never learns it
        # should retry with Basic credentials and just accepts the first
        # unauthenticated 401 as final. "always" so it's added on error
        # responses too, not just 2xx/3xx.
        auth_request /_registry_auth;
        add_header WWW-Authenticate 'Basic realm="Registry"' always;

        proxy_pass http://127.0.0.1:5051;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900;
    }
}

